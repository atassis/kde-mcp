[package]
name = "kde-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "MCP server for KDE Plasma 6 Wayland desktop control"
license = "MIT"
repository = ""
readme = "README.md"
authors = ["atassis"]
keywords = ["mcp", "kde", "wayland", "computer-use", "agent"]
categories = ["command-line-utilities", "accessibility"]
publish = false

[[bin]]
name = "kde-mcp"
path = "src/main.rs"

# Phase 0 deps only. Each subsequent phase adds the dependencies it actually
# uses (atspi, reis, xkbcommon, portable-pty, image, tesseract, ...).
[dependencies]
rmcp           = { version = "1.7", features = ["server", "macros", "transport-io"] }
tokio          = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "io-std", "fs"] }
zbus           = { version = "5.15", default-features = false, features = ["tokio"] }
clap           = { version = "4.6", features = ["derive"] }
thiserror      = "2.0"
anyhow         = "1.0"
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
# rmcp 1.7 pulls in schemars 1.x internally; pinning the same major avoids
# the multi-version trait conflict surfaced by Phase 0 Spike 0.2.
schemars       = "1.0"
fd-lock        = "4.0"
notify-rust    = "4.17"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono         = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
libc           = "0.2"

[dev-dependencies]
tempfile       = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
