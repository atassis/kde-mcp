[package]
name = "kde-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
build = "build.rs"
description = "MCP server for KDE Plasma 6 Wayland desktop control"
license = "MIT"
repository = "https://github.com/atassis/kde-mcp"
readme = "README.md"
authors = ["atassis"]
keywords = ["mcp", "kde", "wayland", "computer-use", "agent"]
categories = ["command-line-utilities", "accessibility"]
publish = false

[[bin]]
name = "kde-mcp"
path = "src/main.rs"

# Phase 0 deps only. Each subsequent phase adds the dependencies it actually
# uses (atspi, reis, xkbcommon, image, tesseract, ...).
[dependencies]
rmcp           = { version = "2.1", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio          = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "io-std", "fs", "process"] }
zbus           = { version = "5.15", default-features = false, features = ["tokio"] }
zvariant       = "5.7"
clap           = { version = "4.6", features = ["derive"] }
thiserror      = "2.0"
anyhow         = "1.0"
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
# rmcp 1.7 pulls in schemars 1.x internally; pinning the same major avoids
# the multi-version trait conflict surfaced by Phase 0 Spike 0.2.
schemars       = "1.0"
fd-lock        = "4.0"
notify-rust    = "4.17"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono         = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
libc           = "0.2"

# Phase 1 additions:
atspi          = { version = "=0.30", features = ["tokio"] }
image          = { version = "0.25", default-features = false, features = ["png"] }
uuid           = { version = "1.10", features = ["v4", "serde"] }
futures-util   = "0.3"
sha2           = "0.11"
base64         = "0.22"
regex-lite     = "0.1"
nix            = { version = "0.31", default-features = false, features = ["fs"] }
tempfile       = "3.10"

# Phase 2 additions:
reis           = { version = "=0.6.1", features = ["tokio"] }

# Phase 3+ additions (ADR-0013 retired portable-pty + strip-ansi-escapes
# along with the bash tool):
toml           = "1.1"
tokio-util     = "0.7"

# Deferral push (2026-05-15):
ksni           = "0.3"
xkbcommon      = "0.9"
tesseract      = "0.15"
parking_lot    = "0.12"

# ADR-0012 (singleton daemon) — HTTP MCP transport:
axum           = "0.8"
dashmap        = "6.1"
listenfd       = "1.0"
rand           = "0.10"

[dev-dependencies]
tempfile       = "3.10"
reqwest        = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
