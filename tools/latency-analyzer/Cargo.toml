[package]
name = "kde-mcp-latency-analyzer"
version = "0.1.0"
edition = "2021"
description = "Reads kde-mcp's audit.jsonl and emits a p50/p95/p99 latency report broken into per-phase deltas."
license = "MIT"
publish = false

[lib]
name = "kde_mcp_latency_analyzer"
path = "src/lib.rs"

[[bin]]
name = "kde-mcp-latency-analyzer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Standalone tool — keep it out of the parent kde-mcp crate's build.
[workspace]

[dev-dependencies]
tempfile = "3.10"
